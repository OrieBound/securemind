# SecureMind — on-prem Docker stack
#
#   docker compose up --build
#
# First boot runs `ollama-init` (default chat + embed weights) then `init`
# (schema, Floci Cognito) then starts the app.
# Open http://localhost:3000 — first visit creates the Owner (your email + password).
#
# Host dev (app on npm run dev, infra only in Docker):
#   docker compose up -d db floci ollama ollama-init
#
# Tear down (wipes local DB + Floci + Ollama model cache):
#   docker compose down -v

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: securemind
      POSTGRES_PASSWORD: securemind
      POSTGRES_DB: securemind
    volumes:
      - securemind-pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemind -d securemind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      # In-container issuer/JWKS use the Compose service name (not localhost).
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - securemind-floci:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - securemind-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      ollama pull nomic-embed-text &&
      ollama pull llama3.2:3b
    restart: "no"

  init:
    build:
      context: .
      target: init
    depends_on:
      db:
        condition: service_healthy
      floci:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_DIR: /bootstrap
      DATABASE_URL: postgresql://securemind:securemind@db:5432/securemind
      DIRECT_URL: postgresql://securemind:securemind@db:5432/securemind
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_CHAT_MODEL: llama3.2:3b
    volumes:
      - securemind-bootstrap:/bootstrap
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - path: .env.onprem
        required: false
    environment:
      SECUREMIND_EDITION: local
      SECUREMIND_RUNTIME: docker
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://securemind:securemind@db:5432/securemind
      DIRECT_URL: postgresql://securemind:securemind@db:5432/securemind
      AUTH_MODE: cognito
      AUTH_ALLOW_LOCAL_FALLBACK: "false"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2:3b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_FALLBACK_MODEL: llama3.2:3b
      DOCUMENT_STORAGE_PATH: /data/uploads
      AVATAR_STORAGE_PATH: /data/avatars
      INSTANCE_KEY_FILE: /data/instance.key
      # Profile list and SSO cache live in this computer's AWS CLI directory.
      # HOME points the SDK at the bind mount below. The test keys above stay
      # for local Floci login; Bedrock hides them and uses the selected profile.
      HOME: /home/nextjs
    volumes:
      - securemind-bootstrap:/bootstrap:ro
      - securemind-data:/data
      # Read-only. Sign in on the computer (`aws sso login`); do not paste keys.
      # Override the path with HOST_AWS_DIR when it is not ~/.aws.
      - type: bind
        source: ${HOST_AWS_DIR:-${USERPROFILE:-${HOME}}/.aws}
        target: /home/nextjs/.aws
        read_only: true
        bind:
          create_host_path: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  securemind-pgdata:
  securemind-floci:
  securemind-ollama:
  securemind-bootstrap:
  securemind-data:
