AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SecureMind bootstrap secrets in AWS Secrets Manager.
  These are operator/deploy secrets the Lambda runtime needs to start —
  not the same path as Admin Settings → InstanceConfig (Postgres) for day-to-day Groq keys.
  See infra/README.md § Secrets model.

Parameters:
  EnvName:
    Type: String
    Default: lab
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: "postgresql://REPLACE:REPLACE@host/securemind?sslmode=require"
    Description: Optional relational Postgres URL (chat/workspaces). Vectors live in DynamoDB.
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional bootstrap Groq key. Empty string stores a single space placeholder.
  FragmentsTableName:
    Type: String
    Default: ""
    Description: DynamoDB fragments table name (from data-dynamodb). Empty skips the secret.

Conditions:
  HasGroq: !Not [!Equals [!Ref GroqApiKey, ""]]
  HasFragmentsTable: !Not [!Equals [!Ref FragmentsTableName, ""]]

Resources:
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "securemind/${EnvName}/database-url"
      Description: SecureMind DATABASE_URL (Neon default / Aurora optional)
      SecretString: !Ref DatabaseUrl
      Tags:
        - Key: Project
          Value: SecureMind
        - Key: Env
          Value: !Ref EnvName

  GroqApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "securemind/${EnvName}/groq-api-key"
      Description: SecureMind bootstrap GROQ_API_KEY (optional)
      SecretString: !If [HasGroq, !Ref GroqApiKey, " "]
      Tags:
        - Key: Project
          Value: SecureMind
        - Key: Env
          Value: !Ref EnvName

  FragmentsTableSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasFragmentsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "securemind/${EnvName}/fragments-table"
      Description: SecureMind DynamoDB fragments table name (ADR 0007)
      SecretString: !Ref FragmentsTableName
      Tags:
        - Key: Project
          Value: SecureMind
        - Key: Env
          Value: !Ref EnvName

Outputs:
  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret
    Export:
      Name: !Sub "securemind-${EnvName}-DatabaseUrlSecretArn"
  GroqApiKeySecretArn:
    Value: !Ref GroqApiKeySecret
    Export:
      Name: !Sub "securemind-${EnvName}-GroqApiKeySecretArn"
  DatabaseUrlSecretName:
    Value: !Sub "securemind/${EnvName}/database-url"
  GroqApiKeySecretName:
    Value: !Sub "securemind/${EnvName}/groq-api-key"
  FragmentsTableSecretArn:
    Condition: HasFragmentsTable
    Value: !Ref FragmentsTableSecret
    Export:
      Name: !Sub "securemind-${EnvName}-FragmentsTableSecretArn"
  StackMode:
    Value: secrets-bootstrap
  UpdateHint:
    Value: "aws secretsmanager put-secret-value — database-url (optional relational) or fragments-table"
