name: Publish app image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - docker-compose.pull.yml
      - .github/workflows/publish-image.yml
      - package.json
      - package-lock.json
      - next.config.ts
      - prisma/**
      - prisma.config.ts
      - public/**
      - scripts/docker/**
      - src/**

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/securemind" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: init
          push: true
          tags: ${{ steps.image.outputs.name }}:init
