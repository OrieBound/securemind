name: Publish app image

# Publishes only after CI has passed on main (or by hand). Each image is scanned before it is
# pushed, pushed with an immutable sha tag as well as the moving tag, signed with Sigstore
# keyless signing (cosign), and carries an SBOM and build provenance.
#
# Verify a pulled image (see docs/deploy/on-prem-docker.md):
#   cosign verify ghcr.io/<owner>/securemind:latest \
#     --certificate-identity-regexp 'https://github.com/<owner>/securemind/.github/workflows/publish-image.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing

jobs:
  publish:
    name: GHCR
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: runner
            tag: latest
            pin: sha
          - target: init
            tag: init
            pin: init-sha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/securemind" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: securemind-scan:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Scan (fail on fixable critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securemind-scan:${{ matrix.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}
            ${{ steps.image.outputs.name }}:${{ matrix.pin }}-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=SecureMind, a privacy-aware AI workspace

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1

      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
